{% extends "base.html" %}
{% block body %}
<div class="progress"><i id="bar" style="width:0%"></i></div>
<div class="round-track" id="round-track"><span class="warmup-chip">Warm-up</span></div>
<div class="meta" id="meta"></div>
<div class="wrap"><div class="stage" id="stage"></div></div>
{% if researcher_mode %}<div id="rmode" class="rmode"></div>{% endif %}
<script>
window.BEAST_CFG = {
  min_delay_ms: {{ min_delay }},
  stimulus_ms: {{ stimulus_ms }},
  collect_ratings: {{ collect_ratings }},
  rating_every: {{ rating_every }},
  prefill_final: {{ prefill_final }},
  researcher_mode: {{ researcher_mode }}
};
</script>
<script src="{{ url_for('static', filename='task.js', v='6.0') }}"></script>
{% endblock %}
