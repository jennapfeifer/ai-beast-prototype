# Existing service. Updating this file alone does not change a manually configured service.
services:
  - type: web
    name: ai-beast-prototype
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_CODE
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STUDY_MODE
        value: pilot
      - key: ADVISER_MODE
        value: live
      - key: ADVISER_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ADVISER_THINKING_LEVEL
        value: minimal
      - key: ADVISER_MIN_WORDS
        value: "6"
      - key: ADVISER_MAX_WORDS
        value: "12"
      - key: ADVISER_WORD_TOLERANCE
        value: "3"
      - key: ADVISER_MAX_ATTEMPTS
        value: "3"
      - key: ADVISER_REQUEST_TIMEOUT
        value: "15"
      - key: ADVISER_TOTAL_BUDGET_SECONDS
        value: "60"
      - key: ADVISER_MIN_DELAY_MS
        value: "0"
      - key: STIMULUS_MS
        value: "5000"
      - key: FIXATION_MS
        value: "450"
      - key: COLLECT_RATINGS
        value: "1"
      - key: RATING_EVERY
        value: "2"
      - key: SHOW_END_SCORE
        value: "1"
      - key: TTS_MODEL
        value: gpt-4o-mini-tts
      - key: TTS_VOICE
        value: marin
      - key: TTS_TIMEOUT_S
        value: "30"
